name: App and backend checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - run: npm run check:auth
      - run: npx tsc --noEmit --pretty false
      - run: npm run lint
      - run: npm run test:logic
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Test Firestore authorization
        run: npx -y firebase-tools@14 emulators:exec --project demo-heatsense --only auth,firestore 'node scripts/test-team-invites.mjs'
        env:
          GCLOUD_PROJECT: demo-heatsense
      - run: npx expo export --platform web
