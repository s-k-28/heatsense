name: Auth preflight

on:
  push:
  pull_request:

jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - run: npm run check:auth
      - run: npx tsc --noEmit --pretty false
      - run: npm run lint
      - run: npx expo export --platform web
